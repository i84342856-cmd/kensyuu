<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<title>Crypto Pro - Multi-Timeframe Engine</title>
	<script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
	<style>
		body {
			font-family: sans-serif;
			background: #1e222d;
			color: #d1d4dc;
			margin: 0;
			padding: 20px;
		}

		.layout {
			display: flex;
			gap: 20px;
		}

		.main-col {
			flex: 3;
		}

		.side-col {
			flex: 1;
			background: #2b313f;
			padding: 15px;
			border-radius: 8px;
			height: fit-content;
			border: 1px solid #434651;
		}

		.controls {
			background: #2b313f;
			padding: 15px;
			border-radius: 8px;
			margin-bottom: 20px;
			display: flex;
			gap: 15px;
			align-items: center;
			border: 1px solid #434651;
		}

		select,
		input,
		button {
			padding: 8px 12px;
			border-radius: 4px;
			border: 1px solid #434651;
			background: #1e222d;
			color: #d1d4dc;
			cursor: pointer;
		}

		button {
			background: #2962ff;
			color: white;
			border: none;
			font-weight: bold;
		}

		.chart-legend {
			display: flex;
			flex-wrap: wrap;
			gap: 15px;
			margin-bottom: 10px;
			font-size: 13px;
			font-weight: bold;
			background: #2b313f;
			padding: 10px 15px;
			border-radius: 8px;
			border: 1px solid #434651;
		}

		#chart-container {
			height: 500px;
			border-radius: 8px;
			border: 1px solid #434651;
		}

		.history-container {
			margin-top: 20px;
			background: #2b313f;
			padding: 15px;
			border-radius: 8px;
			border: 1px solid #434651;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			margin-top: 10px;
			font-size: 13px;
		}

		th,
		td {
			padding: 10px;
			border-bottom: 1px solid #434651;
			text-align: left;
		}

		.buy {
			color: #26a69a;
			font-weight: bold;
		}

		.sell {
			color: #ef5350;
			font-weight: bold;
		}

		.strategy-badge {
			background: #37474f;
			color: #fff;
			padding: 3px 6px;
			border-radius: 4px;
			font-size: 11px;
			font-weight: bold;
			display: inline-block;
			margin-bottom: 2px;
		}

		.setting-group {
			margin-bottom: 15px;
			padding: 10px;
			background: #1e222d;
			border-radius: 6px;
			border: 1px solid #434651;
		}
		.setting-group h4 {
			margin: 0 0 10px 0;
			color: #ffb74d;
			font-size: 14px;
		}
		.checkbox-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
			gap: 8px;
			font-size: 12px;
		}
		.checkbox-grid label {
			display: flex;
			align-items: center;
			cursor: pointer;
		}
		.checkbox-grid input[type="checkbox"] {
			margin-right: 5px;
		}
		.batch-btn {
			background: #00c853;
			width: 100%;
			padding: 10px;
			margin-top: 5px;
		}
		.batch-btn:hover { background: #00e676; }
		.stop-btn { background: #ef5350; width: 100%; padding: 10px; margin-top: 5px; }
		.stop-btn:hover { background: #ff8a80; }

		.ai-panel {
			border: 1px solid #2962ff;
			background: rgba(41, 98, 255, 0.1);
		}
		.ai-value {
			font-size: 18px;
			font-weight: bold;
			color: #fff;
		}
	</style>
</head>

<body>
	<div class="controls">
		<span style="font-weight:bold; color:#ffb74d;">表示チャート:</span>
		<select id="symbolSelect"></select>
		<select id="timeframeSelect">
			<option value="M5" selected>5分足</option>
			<option value="M15">15分足</option>
			<option value="M30">30分足</option>
			<option value="H1">1時間足</option>
			<option value="D1">日足</option>
			<option value="W1">週足</option>
		</select>
		<button id="loadBtn">チャート表示</button>
		<span style="margin-left:auto; color:#2962ff; font-weight:bold;" id="system-status">⏳ システム準備中...</span>
	</div>

	<div class="layout">
		<div class="main-col">
			<div class="chart-legend">
				<span style="color: #26a69a;">■ ローソク足</span>
				<span style="color: #2962ff;">■ MA 5</span>
				<span style="color: #4caf50;">■ MA 10</span>
				<span style="color: #ff1744;">■ MA 25</span>
				<span style="color: #ffeb3b;">■ MA 50</span>
				<span style="color: #ff9100;">■ MA 75</span>
				<span style="color: #e040fb;">■ MA 100</span>
			</div>
			
			<div id="chart-container"></div>
			
			<div class="history-container" style="margin-top: 20px;">
				<h3 style="margin-top:0; color:#ffb74d;">🧪 バックテスト・シミュレーター</h3>
				<div style="display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap;">
					<div>
						<label style="display:block; font-size:12px; font-weight:bold; margin-bottom:5px;">通貨ペア</label>
						<select id="btSymbol" style="padding:8px; border-radius:4px; border:1px solid #434651; background:#1e222d; color:#d1d4dc;">
							<option value="BTC_JPY">BTC_JPY</option>
							<option value="FX_BTC_JPY">FX_BTC_JPY</option>
							<option value="ETH_JPY">ETH_JPY</option>
							<option value="XRP_JPY">XRP_JPY</option>
						</select>
					</div>
					<div>
						<label style="display:block; font-size:12px; font-weight:bold; margin-bottom:5px;">時間足</label>
						<select id="btTimeframe" style="padding:8px; border-radius:4px; border:1px solid #434651; background:#1e222d; color:#d1d4dc;">
							<option value="M5">5分足</option>
							<option value="M15">15分足</option>
							<option value="M30">30分足</option>
							<option value="H1">1時間足</option>
							<option value="H4">4時間足</option>
						</select>
					</div>
					<div>
						<label style="display:block; font-size:12px; font-weight:bold; margin-bottom:5px;">戦略ID</label>
						<select id="btStrategyId" style="padding:8px; border-radius:4px; border:1px solid #434651; background:#1e222d; color:#d1d4dc;">
							<option value="1">1 (MAクロス)</option>
							<option value="200">200 (BBウォーク)</option>
							<option value="300">300 (ブレイクアウト)</option>
							<option value="400">400 (SMA PO)</option>
							<option value="500" selected>500 (EMA PO)</option>
							<option value="600">600 (BBKCスクイーズ)</option>
							<option value="700">700 (XGBoost)</option>
						</select>
					</div>
					<div>
						<label style="display:block; font-size:12px; font-weight:bold; margin-bottom:5px;">取得本数</label>
						<input type="number" id="btCandles" value="2000" style="padding:8px; border-radius:4px; border:1px solid #434651; background:#1e222d; color:#d1d4dc; width:100px;">
					</div>
					<div>
						<button type="button" onclick="runBacktestUI()" style="padding:9px 20px;">▶ 実行</button>
					</div>
				</div>

				<div id="backtestResultArea" style="display:none; margin-top:20px; border-top:1px solid #434651; padding-top:15px;">
					<h4 style="color:#2962ff; margin-top:0;">📊 シミュレーション結果</h4>
					<table style="width:100%; border-collapse: collapse;">
						<tbody id="btResultTable"></tbody>
					</table>
				</div>
			</div>

			<div class="history-container">
				<a href="/api/trades/download" class="btn btn-primary" style="display:inline-block; margin-bottom:10px; background:#2962ff; color:white; padding:8px 12px; text-decoration:none; border-radius:4px;">CSVダウンロード</a>
				<h3 style="margin-top:0;">売買履歴 <span style="float:right; font-size:16px;">合計損益: <span id="total-pnl">0</span> JPY</span></h3>
				<table id="trade-history">
					<thead>
						<tr>
							<th>日時 (JST)</th>
							<th>通貨</th>
							<th>足</th>
							<th>売買</th>
							<th>戦略・根拠</th> 
							<th>価格</th>
							<th>数量</th>
							<th>約定金額</th>
							<th>損益</th>
						</tr>
					</thead>
					<tbody></tbody>
				</table>
			</div>
		</div>
		
		<div class="side-col">
			<div class="setting-group ai-panel">
				<h4 style="color:#2962ff; margin-bottom: 5px;">🧠 AI 推論ステータス</h4>
				<div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
					<span style="font-size: 13px;">AI方向予測:</span>
					<span class="ai-value" id="ui-ai-prob">-- %</span>
				</div>
				<div style="display: flex; justify-content: space-between;">
					<span style="font-size: 13px;">市場レジーム(HMM):</span>
					<span class="ai-value" id="ui-ai-regime" style="color: #ffb74d; font-size: 14px;">--</span>
				</div>
			</div>

			<h3 style="margin-top:0; color:#26a69a;">📊 自動売買 監視設定</h3>
			
			<div class="setting-group">
				<h4>対象通貨</h4>
				<label style="font-size:12px; margin-bottom:8px; display:block;">
					<input type="checkbox" id="checkAllSymbols"> <b>全通貨 一括選択</b>
				</label>
				<div class="checkbox-grid" id="ui-symbols"></div>
			</div>

			<div class="setting-group">
				<h4>対象時間足</h4>
				<label style="font-size:12px; margin-bottom:8px; display:block;">
					<input type="checkbox" id="checkAllTimeframes"> <b>全時間足 一括選択</b>
				</label>
				<div class="checkbox-grid" id="ui-timeframes"></div>
			</div>

			<button id="applyMonitorBtn" class="batch-btn">✓ チェックした組み合わせを 稼働ON</button>
			<button id="stopMonitorBtn" class="stop-btn">✗ チェックした組み合わせを 稼働OFF</button>

			<hr style="border-color:#434651; margin: 20px 0;">

			<h3 style="color:#e040fb;">⚙️ 戦略 ON/OFF 設定</h3>
			<div class="setting-group">
				<div class="checkbox-grid" id="ui-strategies" style="grid-template-columns: 1fr 1fr;">
				</div>
			</div>

			<hr style="border-color:#434651; margin: 20px 0;">
			<h3 style="color:#2962ff;">🤖 現在稼働中の監視Bot</h3>
			<div id="active-bots-list" style="font-size:13px; color:#ffb74d;">取得中...</div>
		</div>
	</div>

	<script>
		const symbols = ["BTC_JPY", "FX_BTC_JPY", "ETH_JPY", "XRP_JPY", "BCH_JPY", "LTC_JPY", "MONA_JPY", "XLM_JPY", "BAT_JPY", "DOT_JPY", "LINK_JPY", "XYM_JPY", "MATIC_JPY", "SHIB_JPY", "DOGE_JPY", "ADA_JPY", "AVAX_JPY", "SAND_JPY", "CHZ_JPY", "FLR_JPY"];
		const timeframes = ["M5", "M15", "M30", "H1", "D1", "W1"]; 
		const strategies = ["1", "200", "300", "400", "500", "600", "700"];

		// --- 画面初期構築 ---
		const symSelect = document.getElementById("symbolSelect");
		const uiSymbols = document.getElementById("ui-symbols");
		symbols.forEach(s => {
			symSelect.add(new Option(s, s));
			uiSymbols.innerHTML += `<label><input type="checkbox" class="sym-chk" value="${s}"> ${s.replace('_JPY','')}</label>`;
		});

		const uiTimeframes = document.getElementById("ui-timeframes");
		timeframes.forEach(tf => {
			uiTimeframes.innerHTML += `<label><input type="checkbox" class="tf-chk" value="${tf}"> ${tf}</label>`;
		});

		const uiStrategies = document.getElementById("ui-strategies");
		strategies.forEach(st => {
			uiStrategies.innerHTML += `<label><input type="checkbox" class="st-chk" value="${st}" onchange="toggleStrategy('${st}', this.checked)"> 戦略 ${st}</label>`;
		});

		// --- 一括選択の挙動 ---
		document.getElementById('checkAllSymbols').onchange = (e) => {
			document.querySelectorAll('.sym-chk').forEach(c => c.checked = e.target.checked);
		};
		document.getElementById('checkAllTimeframes').onchange = (e) => {
			document.querySelectorAll('.tf-chk').forEach(c => c.checked = e.target.checked);
		};

		// --- 監視ON/OFFボタンのアクション ---
		async function applyMonitorAction(isActive) {
			const selectedSyms = Array.from(document.querySelectorAll('.sym-chk:checked')).map(c => c.value);
			const selectedTfs = Array.from(document.querySelectorAll('.tf-chk:checked')).map(c => c.value);
			
			if (selectedSyms.length === 0 || selectedTfs.length === 0) {
				alert("通貨と時間足を少なくとも1つずつ選択してください。");
				return;
			}

			for (const sym of selectedSyms) {
				for (const tf of selectedTfs) {
					await fetch(`/api/settings/monitor?symbol=${sym}&timeframe=${tf}&active=${isActive}`, {method: 'POST'});
				}
			}
			loadMonitorSettings();
			alert(`選択した組み合わせの監視を ${isActive ? 'ON' : 'OFF'} にしました。`);
		}

		document.getElementById('applyMonitorBtn').onclick = () => applyMonitorAction(true);
		document.getElementById('stopMonitorBtn').onclick = () => applyMonitorAction(false);

		// --- 設定の読み込みとUI反映 ---
		async function loadMonitorSettings() {
			const res = await fetch('/api/settings/monitor');
			const settings = await res.json();
			const activeBotsContainer = document.getElementById('active-bots-list');
			activeBotsContainer.innerHTML = '';
			let activeCount = 0;

			for (const [key, isActive] of Object.entries(settings)) {
				if (isActive) {
					activeCount++;
					const parts = key.split('_');
					const tf = parts.pop();
					const sym = parts.join('_');
					activeBotsContainer.innerHTML += `<div style="margin-bottom:5px;">✅ <b>${sym}</b> (${tf}足)</div>`;
				}
			}
			if (activeCount === 0) activeBotsContainer.innerHTML = '<span style="color:#aaa;">現在稼働しているBotはありません</span>';
		}

		async function loadStrategySettings() {
			const res = await fetch('/api/settings/strategy');
			const settings = await res.json();
			document.querySelectorAll('.st-chk').forEach(chk => {
				const stId = chk.value;
				if (settings[stId] !== undefined) {
					chk.checked = settings[stId];
				} else {
					chk.checked = true; // デフォルトON
				}
			});
		}

		async function toggleStrategy(id, isActive) {
			await fetch(`/api/settings/strategy?id=${id}&active=${isActive}`, {method: 'POST'});
		}

		// --- チャート関連 ---
		const JST_OFFSET = 9 * 60 * 60; 
		const chart = LightweightCharts.createChart(document.getElementById('chart-container'), {
			autoSize: true, 
			layout: {background: {color: '#1e222d'}, textColor: '#d1d4dc'},
			grid: {vertLines: {color: '#2b313f'}, horzLines: {color: '#2b313f'}},
			timeScale: {timeVisible: true, secondsVisible: false, rightOffset: 15},
			localization: {locale: 'ja-JP', dateFormat: 'yyyy/MM/dd'}
		});

		const candleSeries = chart.addCandlestickSeries({upColor: '#26a69a', downColor: '#ef5350', borderVisible: false});
		const ma5Series = chart.addLineSeries({color: '#2962ff', lineWidth: 2});   
		const ma10Series = chart.addLineSeries({color: '#4caf50', lineWidth: 1});  
		const ma25Series = chart.addLineSeries({color: '#ff1744', lineWidth: 1});  
		const ma50Series = chart.addLineSeries({color: '#ffeb3b', lineWidth: 1});  
		const ma75Series = chart.addLineSeries({color: '#ff9100', lineWidth: 1});  
		const ma100Series = chart.addLineSeries({color: '#e040fb', lineWidth: 1}); 
		
		let stompClient = null;
		let currentSub = null;
		let totalPnl = 0;
		let activePositions = {}; 
		let currentChartMarkers = []; 
		let allTradesHistory = [];

		function cleanData(arr) {
			if (!arr || arr.length === 0) return [];
			const map = new Map();
			arr.forEach(item => {
				if (item && item.time) map.set(item.time, { ...item, time: item.time + JST_OFFSET });
			});
			return Array.from(map.values()).sort((a, b) => a.time - b.time);
		}

		function createMarkerFromLog(log) {
			if (!log.message || log.strategy <= 0) return null;
			const isLong = log.message.includes("[LONG]");
			const isShort = log.message.includes("[SHORT]");
			const isLongExit = log.message.includes("[LONG決済]");
			const isShortExit = log.message.includes("[SHORT決済]");
			
			let markerText = "";
			let isBuyAction = false;

			if (isLong) { markerText = `買い（戦略${log.strategy}）`; isBuyAction = true; } 
			else if (isLongExit) { markerText = `買い決済（戦略${log.strategy}）`; isBuyAction = false; } 
			else if (isShort) { markerText = `売り（戦略${log.strategy}）`; isBuyAction = false; } 
			else if (isShortExit) { markerText = `売り決済（戦略${log.strategy}）`; isBuyAction = true; } 
			else { return null; }

			return {
				time: log.time + JST_OFFSET,
				position: isBuyAction ? 'belowBar' : 'aboveBar',
				color: isBuyAction ? '#26a69a' : '#ef5350',
				shape: isBuyAction ? 'arrowUp' : 'arrowDown',
				text: markerText
			};
		}

		function updateChartMarkers(trades) {
			const sym = document.getElementById('symbolSelect').value;
			const tf = document.getElementById('timeframeSelect').value;
			currentChartMarkers = [];
			trades.slice().reverse().forEach(t => {
				if (t.symbol === sym && t.timeframe === tf) {
					const marker = createMarkerFromLog(t);
					if (marker) currentChartMarkers.push(marker);
				}
			});
			candleSeries.setMarkers(currentChartMarkers);
		}

		async function loadChartData() {
			const sym = document.getElementById('symbolSelect').value;
			const tf = document.getElementById('timeframeSelect').value;
			
			// ▼▼▼ 追加：チャート切り替え時にAIパネルをリセット ▼▼▼
			    document.getElementById('ui-ai-prob').innerText = '-- %';
			    document.getElementById('ui-ai-regime').innerText = '--';
			    document.getElementById('ui-ai-prob').style.color = '#fff';
			    // ▲▲▲ ここまで ▲▲▲
				
			try {
				const res = await fetch(`/api/chart/init?symbol=${sym}&timeframe=${tf}`);
				const data = await res.json();
				
				candleSeries.setData(cleanData(data.candles));
				ma5Series.setData(cleanData(data.ma5));
				ma10Series.setData(cleanData(data.ma10)); 
				ma25Series.setData(cleanData(data.ma25));
				ma50Series.setData(cleanData(data.ma50)); 
				ma75Series.setData(cleanData(data.ma75)); 
				ma100Series.setData(cleanData(data.ma100)); 

				if (currentSub) currentSub.unsubscribe();
				
				currentSub = stompClient.subscribe(`/topic/${sym}_${tf}`, (msg) => {
					const d = JSON.parse(msg.body);
					const jstTime = d.currentCandle.time + JST_OFFSET;
					
					candleSeries.update({ ...d.currentCandle, time: jstTime });
					if (d.currentMa5 > 0) ma5Series.update({ time: jstTime, value: d.currentMa5 });
					if (d.currentMa10 > 0) ma10Series.update({ time: jstTime, value: d.currentMa10 });
					if (d.currentMa25 > 0) ma25Series.update({ time: jstTime, value: d.currentMa25 });
					if (d.currentMa50 > 0) ma50Series.update({ time: jstTime, value: d.currentMa50 });
					if (d.currentMa75 > 0) ma75Series.update({ time: jstTime, value: d.currentMa75 });
					if (d.currentMa100 > 0) ma100Series.update({ time: jstTime, value: d.currentMa100 });

					// ▼ AI推論ステータスの画面更新 ▼
					// ▼ AI推論ステータスの画面更新 ▼
					if (d.aiUpProbability !== undefined && d.aiUpProbability !== null) {
					    let probElem = document.getElementById('ui-ai-prob');
					    
					    if (d.aiUpProbability >= 0.5) {
					        // 上昇確率が50%以上の場合は「上昇」として表示
					        let probPercent = (d.aiUpProbability * 100).toFixed(1);
					        probElem.innerText = '上昇 ' + probPercent + ' %';
					        probElem.style.color = d.aiUpProbability > 0.6 ? '#26a69a' : '#fff'; // 60%超えで緑色
					    } else {
					        // 上昇確率が50%未満の場合は、反転させて「下落」として表示
					        let downProbPercent = ((1.0 - d.aiUpProbability) * 100).toFixed(1);
					        probElem.innerText = '下落 ' + downProbPercent + ' %';
					        probElem.style.color = d.aiUpProbability < 0.4 ? '#ef5350' : '#fff'; // 下落60%超え(upが40%未満)で赤色
					    }
					}
					if (d.marketRegime) {
						document.getElementById('ui-ai-regime').innerText = d.marketRegime;
					}
				});
				
				fetchHistory();
			} catch (e) {console.error("チャート取得エラー", e);}
		}

		document.getElementById('loadBtn').onclick = loadChartData;
		document.getElementById('symbolSelect').onchange = () => { loadChartData(); };
		document.getElementById('timeframeSelect').onchange = () => { loadChartData(); };

		async function fetchHistory() {
			try {
				const res = await fetch('/api/trades/history');
				allTradesHistory = await res.json();
				document.getElementById('trade-history').tBodies[0].innerHTML = '';
				totalPnl = 0; 
				activePositions = {}; 
				
				allTradesHistory.slice().reverse().forEach(addTradeRow);
				updateChartMarkers(allTradesHistory);
			} catch (e) {console.error(e);}
		}
		
		// --- バックテスト機能 ---
		async function runBacktestUI() {
		    const symbol = document.getElementById('btSymbol').value;
		    const timeframe = document.getElementById('btTimeframe').value;
		    const strategyId = document.getElementById('btStrategyId').value;
		    const candles = document.getElementById('btCandles').value;

		    const resultArea = document.getElementById('backtestResultArea');
		    const tableBody = document.getElementById('btResultTable');
		    
		    resultArea.style.display = 'block';
		    tableBody.innerHTML = '<tr><td colspan="2" style="text-align:center; color:#aaa;">過去データを分析中... APIの取得により数秒かかる場合があります。</td></tr>';

		    try {
		        const response = await fetch(`/api/backtest/run?symbol=${symbol}&timeframe=${timeframe}&strategyId=${strategyId}&candles=${candles}`);
		        if (!response.ok) throw new Error('API実行エラー');
		        const data = await response.json();

		        tableBody.innerHTML = `
		            <tr><th style="width:30%; background:#1e222d; padding:10px; border-bottom:1px solid #434651;">対象戦略</th><td style="padding:10px; border-bottom:1px solid #434651;"><strong>${data.strategyName}</strong> (ID:${strategyId})</td></tr>
		            <tr><th style="background:#1e222d; padding:10px; border-bottom:1px solid #434651;">総取引数</th><td style="padding:10px; border-bottom:1px solid #434651;">${data.totalTrades} 回</td></tr>
		            <tr><th style="background:#1e222d; padding:10px; border-bottom:1px solid #434651;">勝敗</th><td style="padding:10px; border-bottom:1px solid #434651;"><span class="buy">${data.winningTrades}勝</span> / <span class="sell">${data.losingTrades}敗</span></td></tr>
		            <tr><th style="background:#1e222d; padding:10px; border-bottom:1px solid #434651;">勝率</th><td style="padding:10px; border-bottom:1px solid #434651;"><span style="font-size:1.2em; font-weight:bold; color:#2962ff;">${data.winRate}%</span></td></tr>
		            <tr><th style="background:#1e222d; padding:10px; border-bottom:1px solid #434651;">純損益</th><td style="padding:10px; border-bottom:1px solid #434651;"><strong class="${data.totalProfit >= 0 ? 'buy' : 'sell'}" style="font-size: 1.2em;">${data.totalProfit.toLocaleString()} 円</strong></td></tr>
		            <tr><th style="background:#1e222d; color:#ef5350; padding:10px; border-bottom:1px solid #434651;">最大ドローダウン</th><td class="sell" style="padding:10px; border-bottom:1px solid #434651;">-${data.maxDrawdown.toLocaleString()} 円</td></tr>
		            <tr><th style="background:#1e222d; padding:10px; border-bottom:1px solid #434651;">最終残高</th><td style="padding:10px; border-bottom:1px solid #434651;">${data.finalBalance.toLocaleString()} 円 <span style="font-size:11px; color:#aaa;">(初期: 1,000,000円)</span></td></tr>
		        `;
		    } catch (error) {
		        console.error('Backtest error:', error);
		        tableBody.innerHTML = '<tr><td colspan="2" class="sell" style="text-align:center; padding:10px;">シミュレーションに失敗しました。CryptoCompareのAPI制限か、パラメータを確認してください。</td></tr>';
		    }
		}

		// --- 履歴テーブル描画 ---
		function addTradeRow(t) {
			const tbody = document.getElementById('trade-history').tBodies[0];
			const row = tbody.insertRow(0);

			const jstTimeString = new Date(t.time * 1000).toLocaleString('ja-JP', { 
				timeZone: 'Asia/Tokyo', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit'
			});

			if (t.side === 'SYSTEM BOOTING' || t.side === 'SYSTEM READY' || t.side === 'INFO') {
				row.innerHTML = `<td>${jstTimeString}</td><td colspan="8" style="color:#2962ff; font-weight:bold;">${t.message || 'システム情報'}</td>`;
				if (t.side === 'SYSTEM READY') document.getElementById('system-status').innerHTML = "✅ システム全稼働中";
				return;
			}

			let pnl = 0, pnlText = '-', totalAmt = '-';
			const key = t.symbol + t.timeframe;
			let actionHtml = '';

			if (t.side !== 'INFO') {
				totalAmt = Math.floor(t.price * t.size).toLocaleString() + ' JPY';
				let pos = activePositions[key];
				
				if (!pos) {
					if (t.side === 'BUY') { activePositions[key] = { type: 'LONG', price: t.price }; actionHtml = '<span class="buy">LONG エントリー</span>'; }
					else if (t.side === 'SELL') { activePositions[key] = { type: 'SHORT', price: t.price }; actionHtml = '<span class="sell">SHORT エントリー</span>'; }
				} else {
					if (pos.type === 'LONG' && t.side === 'SELL') { pnl = Math.floor((t.price - pos.price) * t.size); activePositions[key] = null; actionHtml = '<span style="color:#ffb74d; font-weight:bold;">✅ 決済 (LONG)</span>'; }
					else if (pos.type === 'SHORT' && t.side === 'BUY') { pnl = Math.floor((pos.price - t.price) * t.size); activePositions[key] = null; actionHtml = '<span style="color:#ffb74d; font-weight:bold;">✅ 決済 (SHORT)</span>'; }
					if (actionHtml.includes('決済')) {
						totalPnl += pnl;
						document.getElementById('total-pnl').innerText = totalPnl.toLocaleString();
						pnlText = pnl > 0 ? '+' + pnl.toLocaleString() : pnl.toLocaleString();
					}
				}
			}

			let strategyHtml = '-';
			if (t.strategy && t.strategy > 0) {
				const cleanMsg = t.message ? t.message.replace(/🟢 \[.*?\] |🔴 \[.*?\] |✅ \[.*?\] /, '') : '';
				strategyHtml = `<span class="strategy-badge">戦略${t.strategy}</span><br><span style="font-size: 10px; color: #aaa;">${cleanMsg}</span>`;
			} else if (t.message) {
				strategyHtml = `<span style="font-size: 10px; color: #aaa;">${t.message}</span>`;
			}
			
			row.innerHTML = `<td>${jstTimeString}</td><td><b>${t.symbol}</b></td><td>${t.timeframe}</td><td>${actionHtml}</td><td>${strategyHtml}</td><td>${t.price > 0 ? t.price.toLocaleString() : '-'}</td><td>${t.size}</td><td>${totalAmt}</td><td class="${pnl >= 0 ? 'buy' : 'sell'}">${pnlText}</td>`;
		}

		function connect() {
			stompClient = Stomp.over(new SockJS('/ws-market-data'));
			stompClient.debug = null;
			stompClient.connect({}, () => {
				loadMonitorSettings();
				loadStrategySettings();
				loadChartData();
				
				stompClient.subscribe('/topic/trades', (msg) => {
					const t = JSON.parse(msg.body);
					addTradeRow(t);
					allTradesHistory.unshift(t);
					
					const sym = document.getElementById('symbolSelect').value;
					const tf = document.getElementById('timeframeSelect').value;
					if (t.symbol === sym && t.timeframe === tf) {
						const newMarker = createMarkerFromLog(t);
						if (newMarker) {
							currentChartMarkers.push(newMarker);
							currentChartMarkers.sort((a, b) => a.time - b.time);
							candleSeries.setMarkers(currentChartMarkers);
						}
					}
				});
			}, () => setTimeout(connect, 5000));
		}

		connect();
	</script>
