spring.application.name=moattravel3

# ================================================================
#  データベース設定 (MySQL)
# ================================================================
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/moat_travel3_db
spring.datasource.username=root
spring.datasource.password=23490811
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# SQLの初期化設定 (起動時にテーブル作成などを実行)
spring.sql.init.encoding=utf-8

# spring.sql.init.mode=never にすると、実行時のdata.sql は無視されるようになります。有効にするときは「always」
spring.sql.init.mode=always

# 起動時にエンティティクラスを元に、自動でテーブルをDrop＆Createする設定 spring.jpa.hibernate.ddl-auto=create

# 「テーブルの形」 を守ってくれる
spring.jpa.hibernate.ddl-auto=update

# ================================================================
# 　ファイルアップロード設定
# ================================================================
# 画像などの最大ファイルサイズを5MBに制限
spring.servlet.multipart.max-file-size=5MB


