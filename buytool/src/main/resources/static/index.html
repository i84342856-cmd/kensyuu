<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<title>Crypto Pro - Multi-Timeframe Engine</title>
	<script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
	<style>
		body {
			font-family: sans-serif;
			background: #1e222d;
			color: #d1d4dc;
			margin: 0;
			padding: 20px;
		}

		.layout {
			display: flex;
			gap: 20px;
		}

		.main-col {
			flex: 3;
		}

		.side-col {
			flex: 1;
			background: #2b313f;
			padding: 15px;
			border-radius: 8px;
			height: fit-content;
			border: 1px solid #434651;
		}

		.controls {
			background: #2b313f;
			padding: 15px;
			border-radius: 8px;
			margin-bottom: 20px;
			display: flex;
			gap: 15px;
			align-items: center;
			border: 1px solid #434651;
		}

		select,
		button {
			padding: 8px 12px;
			border-radius: 4px;
			border: 1px solid #434651;
			background: #1e222d;
			color: #d1d4dc;
			cursor: pointer;
		}

		button {
			background: #2962ff;
			color: white;
			border: none;
			font-weight: bold;
		}

		/* 凡例（レジェンド）用のスタイル */
		.chart-legend {
			display: flex;
			flex-wrap: wrap;
			gap: 15px;
			margin-bottom: 10px;
			font-size: 13px;
			font-weight: bold;
			background: #2b313f;
			padding: 10px 15px;
			border-radius: 8px;
			border: 1px solid #434651;
		}

		#chart-container {
			height: 500px;
			border-radius: 8px;
			border: 1px solid #434651;
		}

		.history-container {
			margin-top: 20px;
			background: #2b313f;
			padding: 15px;
			border-radius: 8px;
			border: 1px solid #434651;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			margin-top: 10px;
			font-size: 13px;
		}

		th,
		td {
			padding: 10px;
			border-bottom: 1px solid #434651;
			text-align: left;
		}

		.buy {
			color: #26a69a;
			font-weight: bold;
		}

		.sell {
			color: #ef5350;
			font-weight: bold;
		}

		.setting-item {
			display: flex;
			justify-content: space-between;
			margin-bottom: 10px;
			font-size: 14px;
			border-bottom: 1px solid #434651;
			padding-bottom: 8px;
		}

		input[type="checkbox"] {
			transform: scale(1.3);
			cursor: pointer;
		}

		.batch-btn {
			background: #00c853;
			font-size: 15px;
			padding: 10px 20px;
		}

		.batch-btn:hover {
			background: #00e676;
		}
	</style>
</head>

<body>
	<div class="controls">
		<select id="symbolSelect"></select>
		<select id="timeframeSelect">
			<option value="M1">1分足</option>
			<option value="M5" selected>5分足</option>
			<option value="M15">15分足</option>
			<option value="M30">30分足</option>
			<option value="H1">1時間足</option>
			<option value="D1">日足</option>
			<option value="W1">週足</option>
		</select>
		<button id="loadBtn">チャート再表示</button>
		<button id="enableAllBtn" class="batch-btn">🔥 全通貨の「1分/5分/15分/30分足」を一括ON</button>
		<span style="margin-left:auto; color:#2962ff; font-weight:bold;" id="system-status">⏳ システム準備中...</span>
	</div>

	<div class="layout">
		<div class="main-col">
			<div class="chart-legend">
				<span style="color: #26a69a;">■ ローソク足</span>
				<span style="color: #2962ff;">■ MA 5</span>
				<span style="color: #4caf50;">■ MA 10</span>
				<span style="color: #ff1744;">■ MA 25</span>
				<span style="color: #ffeb3b;">■ MA 50</span>
				<span style="color: #ff9100;">■ MA 75</span>
				<span style="color: #e040fb;">■ MA 100</span>
			</div>
			
			<div id="chart-container"></div>
			
			<div class="history-container">
				<h3>売買履歴 <span style="float:right">合計損益: <span id="total-pnl">0</span> JPY</span></h3>
				<table id="trade-history">
					<thead>
						<tr>
							<th>時刻</th>
							<th>通貨</th>
							<th>足</th>
							<th>売買</th>
							<th>価格</th>
							<th>数量</th>
							<th>約定金額</th>
							<th>損益</th>
						</tr>
					</thead>
					<tbody></tbody>
				</table>
			</div>
		</div>
		<div class="side-col">
			<h3 style="margin-top:0; color:#26a69a;">⚙️ 監視設定 (個別)</h3>
			<p style="font-size:12px; color:#aaa;">現在表示中の通貨のみの個別設定です。</p>
			<div id="monitor-settings"></div>

			<hr style="border-color:#434651; margin: 20px 0;">
			<h3 style="color:#2962ff;">🤖 稼働中の全Bot一覧</h3>
			<div id="active-bots-list" style="font-size:13px; color:#ffb74d;">取得中...</div>
		</div>
	</div>

	<script>
		const symbols = ["BTC_JPY", "FX_BTC_JPY", "ETH_JPY", "XRP_JPY", "BCH_JPY", "LTC_JPY", "MONA_JPY", "XLM_JPY", "BAT_JPY", "DOT_JPY", "LINK_JPY", "XYM_JPY", "MATIC_JPY", "SHIB_JPY", "DOGE_JPY", "ADA_JPY", "AVAX_JPY", "SAND_JPY", "CHZ_JPY", "FLR_JPY"];
		const timeframes = ["M1", "M5", "M15", "M30", "H1", "D1", "W1"];
		const select = document.getElementById("symbolSelect");
		symbols.forEach(s => select.add(new Option(s, s)));

		// 1. まずchartを作成する
		const chart = LightweightCharts.createChart(document.getElementById('chart-container'), {
			autoSize: true, 
			layout: {background: {color: '#1e222d'}, textColor: '#d1d4dc'},
			grid: {vertLines: {color: '#2b313f'}, horzLines: {color: '#2b313f'}},
			timeScale: {
				timeVisible: true,
				secondsVisible: false,
				rightOffset: 15
			},
			localization: {
				locale: 'ja-JP',
				dateFormat: 'yyyy/MM/dd',
			}
		});

		// 2. その後でシリーズを追加する
		const candleSeries = chart.addCandlestickSeries({upColor: '#26a69a', downColor: '#ef5350', borderVisible: false});
		const ma5Series = chart.addLineSeries({color: '#2962ff', lineWidth: 2});   // 青
		const ma10Series = chart.addLineSeries({color: '#4caf50', lineWidth: 1});  // 緑
		const ma25Series = chart.addLineSeries({color: '#ff1744', lineWidth: 1});  // 赤
		const ma50Series = chart.addLineSeries({color: '#ffeb3b', lineWidth: 1});  // 黄
		const ma75Series = chart.addLineSeries({color: '#ff9100', lineWidth: 1});  // オレンジ
		const ma100Series = chart.addLineSeries({color: '#e040fb', lineWidth: 1}); // 紫

		let stompClient = null;
				let currentSub = null;
				let totalPnl = 0;
				// ★変更: 単なる lastBuyPrices ではなく、現在のポジション状態を管理するオブジェクトにする
				let activePositions = {}; 

				function cleanData(arr) {
					if (!arr || arr.length === 0) return [];
					const map = new Map();
					arr.forEach(item => {
						if (item && item.time) {
							map.set(item.time, item);
						}
					});
					return Array.from(map.values()).sort((a, b) => a.time - b.time);
				}

				async function loadSettings() {
					const res = await fetch('/api/settings/monitor');
					const settings = await res.json();

					const container = document.getElementById('monitor-settings');
					container.innerHTML = '';
					const curSym = select.value;
					timeframes.forEach(tf => {
						const key = curSym + "_" + tf;
						const active = settings[key] || false;
						const div = document.createElement('div');
						div.className = 'setting-item';
						div.innerHTML = `<span><b>${tf}</b> 監視</span><input type="checkbox" ${active ? 'checked' : ''} onchange="toggleSetting('${curSym}','${tf}',this.checked)">`;
						container.appendChild(div);
					});

					const activeBotsContainer = document.getElementById('active-bots-list');
					activeBotsContainer.innerHTML = '';
					let activeCount = 0;
					for (const [key, isActive] of Object.entries(settings)) {
						if (isActive) {
							activeCount++;
							const parts = key.split('_');
							const tf = parts.pop();
							const sym = parts.join('_');
							activeBotsContainer.innerHTML += `<div style="margin-bottom:5px;">✅ <b>${sym}</b> (${tf}足)</div>`;
						}
					}
					if (activeCount === 0) activeBotsContainer.innerHTML = '<span style="color:#aaa;">現在稼働しているBotはありません</span>';
				}

				async function toggleSetting(sym, tf, active) {
					await fetch(`/api/settings/monitor?symbol=${sym}&timeframe=${tf}&active=${active}`, {method: 'POST'});
					loadSettings();
				}

				document.getElementById('enableAllBtn').onclick = async () => {
					const btn = document.getElementById('enableAllBtn');
					btn.innerText = "🔄 起動中...";
					const targetTimeframes = ["M1", "M5", "M15", "M30"];
					for (const tf of targetTimeframes) {
						await fetch(`/api/settings/monitor/all?timeframe=${tf}`, {method: 'POST'});
					}
					btn.innerText = "🔥 全通貨の「1分/5分/15分/30分足」を一括ON";
					loadSettings();
				};

				async function loadChartData() {
					const sym = document.getElementById('symbolSelect').value;
					const tf = document.getElementById('timeframeSelect').value;
					try {
						const res = await fetch(`/api/chart/init?symbol=${sym}&timeframe=${tf}`);
						const data = await res.json();
						candleSeries.setData(cleanData(data.candles));
						ma5Series.setData(cleanData(data.ma5));
						ma10Series.setData(cleanData(data.ma10)); 
						ma25Series.setData(cleanData(data.ma25));
						ma50Series.setData(cleanData(data.ma50)); 
						ma75Series.setData(cleanData(data.ma75)); 
						ma100Series.setData(cleanData(data.ma100)); 

						if (currentSub) currentSub.unsubscribe();
						currentSub = stompClient.subscribe(`/topic/${sym}_${tf}`, (msg) => {
							const d = JSON.parse(msg.body);
							const time = d.currentCandle.time;
							candleSeries.update(d.currentCandle);
							if (d.currentMa5 > 0) ma5Series.update({time, value: d.currentMa5});
							if (d.currentMa10 > 0) ma10Series.update({time, value: d.currentMa10});
							if (d.currentMa25 > 0) ma25Series.update({time, value: d.currentMa25});
							if (d.currentMa50 > 0) ma50Series.update({time, value: d.currentMa50});
							if (d.currentMa75 > 0) ma75Series.update({time, value: d.currentMa75});
							if (d.currentMa100 > 0) ma100Series.update({time, value: d.currentMa100});
						});
						loadSettings();
					} catch (e) {console.error("チャート取得エラー", e);}
				}

				document.getElementById('loadBtn').onclick = loadChartData;
				document.getElementById('symbolSelect').onchange = () => { loadSettings(); loadChartData(); };
				document.getElementById('timeframeSelect').onchange = () => { loadSettings(); loadChartData(); };

				async function fetchHistory() {
					try {
						const res = await fetch('/api/trades/history');
						const trades = await res.json();
						document.getElementById('trade-history').tBodies[0].innerHTML = '';
						totalPnl = 0; 
						activePositions = {}; // 初期化
						trades.reverse().forEach(addTradeRow);
					} catch (e) {console.error(e);}
				}

				// ★大幅変更: LONG/SHORTの判別と損益計算ロジック
				function addTradeRow(t) {
					const tbody = document.getElementById('trade-history').tBodies[0];
					const row = tbody.insertRow(0);

					if (t.side === 'SYSTEM BOOTING' || t.side === 'SYSTEM READY' || t.side === 'INFO') {
						row.innerHTML = `<td>${new Date(t.time * 1000).toLocaleTimeString()}</td><td colspan="7" style="color:#2962ff; font-weight:bold;">${t.message || 'システム情報'}</td>`;
						if (t.side === 'SYSTEM READY') document.getElementById('system-status').innerHTML = "✅ システム全稼働中";
						return;
					}

					let pnl = 0, pnlText = '-', totalAmt = '-';
					const key = t.symbol + t.timeframe;
					let actionHtml = '';

					if (t.side !== 'INFO') {
						totalAmt = Math.floor(t.price * t.size).toLocaleString() + ' JPY';
						
						let pos = activePositions[key];
						
						if (!pos) {
							// 📌 ポジションを持っていない状態からのエントリー
							if (t.side === 'BUY') {
								activePositions[key] = { type: 'LONG', price: t.price };
								actionHtml = '<span class="buy">LONG エントリー</span>';
							} else if (t.side === 'SELL') {
								activePositions[key] = { type: 'SHORT', price: t.price };
								actionHtml = '<span class="sell">SHORT エントリー</span>';
							}
						} else {
							// 📌 すでにポジションを持っている状態での決済
							if (pos.type === 'LONG' && t.side === 'SELL') {
								// 買いの決済 (売値 - 買値)
								pnl = Math.floor((t.price - pos.price) * t.size);
								activePositions[key] = null;
								actionHtml = '<span style="color:#ffb74d; font-weight:bold;">✅ 決済 (LONG)</span>';
							} else if (pos.type === 'SHORT' && t.side === 'BUY') {
								// 空売りの決済 (売値 - 買戻し値) ★空売りは安く買い戻すとプラス
								pnl = Math.floor((pos.price - t.price) * t.size); 
								activePositions[key] = null;
								actionHtml = '<span style="color:#ffb74d; font-weight:bold;">✅ 決済 (SHORT)</span>';
							}

							// 決済が発生した場合のみ損益を画面に反映
							if (actionHtml.includes('決済')) {
								totalPnl += pnl;
								document.getElementById('total-pnl').innerText = totalPnl.toLocaleString();
								pnlText = pnl > 0 ? '+' + pnl.toLocaleString() : pnl.toLocaleString();
							}
						}
					}
					
					row.innerHTML = `<td>${new Date(t.time * 1000).toLocaleTimeString()}</td>
					                 <td><b>${t.symbol}</b></td>
					                 <td>${t.timeframe}</td>
					                 <td>${actionHtml}</td>
					                 <td>${t.price > 0 ? t.price.toLocaleString() : '-'}</td>
					                 <td>${t.size}</td>
					                 <td>${totalAmt}</td>
					                 <td class="${pnl >= 0 ? 'buy' : 'sell'}">${pnlText}</td>`;
				}

				function connect() {
					stompClient = Stomp.over(new SockJS('/ws-market-data'));
					stompClient.debug = null;
					stompClient.connect({}, () => {
						loadChartData();
						fetchHistory();
						stompClient.subscribe('/topic/trades', (msg) => addTradeRow(JSON.parse(msg.body)));
					}, () => setTimeout(connect, 5000));
				}

				connect();
	</script>
</body>

</html>
